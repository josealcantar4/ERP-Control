<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>ERP Control</title>
    <meta name="title" content="ERP Control" />
    <meta name="description" content="ERP Control - Sistema de gestión farmacéutica" />

    <!-- Favicon & Mobile Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#2563eb" />

    <!-- PWA / Web App Capabilities -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ERP Control" />
    <meta name="application-name" content="ERP Control" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Preconnect to Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Script inicial para evitar parpadeo de tema (FOUC) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('erp_theme') || 'sistema';
          var isDark = t === 'oscuro' || t === 'dark' || ((t === 'sistema' || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          var metaScheme = document.querySelector('meta[name="color-scheme"]');
          var metaAppleBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            root.style.backgroundColor = '#0f172a';
            if (metaTheme) metaTheme.setAttribute('content', '#0f172a');
            if (metaScheme) metaScheme.setAttribute('content', 'dark');
            if (metaAppleBar) metaAppleBar.setAttribute('content', 'black-translucent');
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            root.style.backgroundColor = '#f8fafc';
            if (metaTheme) metaTheme.setAttribute('content', '#ffffff');
            if (metaScheme) metaScheme.setAttribute('content', 'light');
            if (metaAppleBar) metaAppleBar.setAttribute('content', 'default');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
